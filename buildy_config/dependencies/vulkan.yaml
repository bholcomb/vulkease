# Vulkan SDK dependency
# All platforms use the LunarG Vulkan SDK through the VULKAN_SDK environment
# variable. On Linux, source the SDK's setup-env.sh before building; the
# distribution packages ship an older loader that lacks Vulkan 1.4.

vulkan:
  description: "Vulkan graphics API"
  
  linux:
    include_dirs: ["${VULKAN_SDK}/include"]
    lib_dirs: ["${VULKAN_SDK}/lib/VulkanLoader/lib"]
    libs: ["vulkan"]
    defines: ["VK_USE_PLATFORM_XCB_KHR"]
    
  windows:
    include_dirs: ["${VULKAN_SDK}/Include"]
    lib_dirs: ["${VULKAN_SDK}/Lib"]
    libs: ["vulkan-1.lib"]
    defines: ["VK_USE_PLATFORM_WIN32_KHR"]
  
  macos:
    include_dirs: ["${VULKAN_SDK}/include"]
    lib_dirs: ["${VULKAN_SDK}/lib"]
    libs: ["vulkan"]
    defines: ["VK_USE_PLATFORM_MACOS_MVK"]
