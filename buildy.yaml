# VulkEase - Vulkan made easy
# Root build configuration

project:
  name: vulkease
  version: "2.0.0"
  description: "VulkEase - A simplified Vulkan wrapper library"

variables:
  import_env_vars:
    # These are only required on Windows; Linux uses system packages
    - name: VULKAN_SDK
      default: ""                   # Empty default for Linux (uses system paths)
    - name: GLFW_ROOT
      default: ""                   # Empty default for Linux (uses system paths)

  SO_VERSION: "2"
  
  # Platform-specific dotnet runtime paths
  platforms:
    linux:
      DOTNET_RUNTIME_DIR: "dotnet/src/runtimes/linux-x64/native"
    windows:
      DOTNET_RUNTIME_DIR: "dotnet/src/runtimes/win-x64/native"
    macos:
      DOTNET_RUNTIME_DIR: "dotnet/src/runtimes/osx-x64/native"

workspace:
  modules:
    - src
    - examples

dependencies:
  file: buildy_config/dependencies.yaml

environment:
  toolchains:
    default: gcc-cpp-linux
    windows: msvc-cpp-windows
    macos: clang-cpp-macos
    
  compile:
    cpp_standard: "c++17"
    c_standard: "c11"
    warnings: extra
    flags: ["-Wconversion", "-Werror"]
    
  configurations:
    debug:
      optimization: none
      symbols: true
      defines: ["DEBUG=1"]
    release:
      optimization: full
      defines: ["NDEBUG=1"]

staging:
  name: vulkease_dist
  destination: "dist"
  use_symlinks: false

  contents:
    # Main library for distribution
    - folder: "bin"
      files:
        - linux:
            - "${out_dir}/bin/libvulkease.so"
        - windows:
            - "${out_dir}/bin/vulkease.dll"
        - macos:
            - "${out_dir}/bin/libvulkease.dylib"

    - folder: "lib"
      files:
        - windows:
            - "${out_dir}/lib/vulkease.lib"
    
    # Public headers for library users
    - folder: "include"
      files:
        - "src/vulkease.h"

    # docs
    - folder: "docs"
      files:
        - "README.md"